name: Import RIGEL project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project source
        shell: bash
        run: |
          if [ ! -f rigel-abaya-house-github.zip ]; then
            echo "No archive to unpack."
            exit 0
          fi
          unzip -o rigel-abaya-house-github.zip
          rm rigel-abaya-house-github.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import RIGEL website source"
          git push
